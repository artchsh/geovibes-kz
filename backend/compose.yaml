services:
  backend:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - backend-media:/app/storage

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geovibes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geovibes"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  backend-media: